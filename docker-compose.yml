services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apr_services_fullstack
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-secret-key-change-me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-refresh-secret-key-change-me}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
    env_file:
      - path: backend/.env
        required: false
